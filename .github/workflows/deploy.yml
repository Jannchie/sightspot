name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  # 只更新数据时手动触发（scripts/export_demo.py --deploy 会调用它）
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 机位数据不进仓库：scripts/export_demo.py --upload 把 public/data 打包传到 R2，这里取回来。
      # 查询参数带上运行编号，绕过 CDN 缓存拿到最新上传的那份
      - name: Fetch data
        run: |
          curl -fsSL "https://cdn.jannchie.com/photo-spots/data/data.tar.gz?run=${GITHUB_RUN_ID}" | tar -xz -C public
          test -f public/data/spots.geojson
          cat public/data/meta.json

      - name: Deploy
        env:
          # Settings → Secrets and variables → Actions 里添加
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec void deploy --platform cloudflare
